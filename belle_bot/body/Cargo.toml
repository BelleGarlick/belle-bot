[package]
edition = "2021"
name = "belle-bot-9000"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = { version = "1.0.0" }
usb-device = "0.3"
usbd-serial = "0.2"

defmt = "1"
defmt-rtt = "1"
panic-halt = "0.2.0"
panic-probe = { version = "1", features = ["print-defmt"] }

flip-link = "0.1.12"

rp2040-hal = { version="0.10", features=["rt", "critical-section-impl"] }
rp2040-boot2 = "0.3"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
